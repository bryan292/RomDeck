[package]
name = "romdeck_desktop"
version = "0.1.0"
description = "RomDeck desktop shell"
authors = ["RomDeck"]
edition = "2021"

[lib]
name = "romdeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "romdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
