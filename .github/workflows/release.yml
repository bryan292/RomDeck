name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing tag to rebuild, for example v0.1.0. Empty uses package.json version on main.
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Prepare Tag And Draft Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${REQUESTED_TAG:-v$version}"
          tag="${tag#refs/tags/}"
          commit="$(git rev-parse HEAD)"
          prerelease="$REQUESTED_PRERELEASE"
          if [ -z "$prerelease" ]; then
            case "$tag" in
              v0.*|*-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$tag_exists" = true ]; then
            echo "Tag $tag already exists; skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_commit=""
          if [ "$tag_exists" = true ]; then
            git fetch --force --tags origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit="$(git rev-list -n 1 "$tag")"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$REQUESTED_TAG" ] && [ "$tag_exists" = true ] && [ "$tag_commit" != "$commit" ]; then
            echo "::error::Tag $tag already exists at $tag_commit, but package.json on this run resolves to $commit. Bump package.json to a new version, or delete/recreate the failed draft tag before rerunning."
            exit 1
          fi

          if [ "$tag_exists" = false ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "RomDeck $tag" "$commit"
            git push origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$commit" \
              --title "RomDeck $tag" \
              --notes "RomDeck desktop build. Assets are generated by GitHub Actions."
          fi

          if [ "$prerelease" = true ]; then
            gh release edit "$tag" --draft=true --prerelease=true
          else
            gh release edit "$tag" --draft=true --prerelease=false
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release-tauri:
    name: Release ${{ matrix.label }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-24.04
            args: ""
            rust-targets: ""
          - label: Windows x64
            platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri -> target

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Publish Tauri Release Assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop-tauri
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: RomDeck ${{ needs.prepare-release.outputs.tag }}
          releaseBody: |
            RomDeck desktop build.

            Current MVP package note: this build bundles the web UI and JS host resources, but requires a local Node runtime to launch the backend.
          releaseDraft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          releaseAssetNamePattern: RomDeck_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}

      - name: Upload Executables To Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          files: |
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.dmg
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.AppImage
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.deb
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.rpm
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.msi
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.exe
            packages/desktop-tauri/src-tauri/target/**/release/romdeck
            packages/desktop-tauri/src-tauri/target/**/release/romdeck.exe
          fail_on_unmatched_files: false
