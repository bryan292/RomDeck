name: Prepare Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to prepare, for example 0.2.0
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare-version:
    name: Prepare Version Pull Request
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set Version
        run: |
          node scripts/set-version.mjs "${{ inputs.version }}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate
        run: |
          npm run build
          npm test
          npm run typecheck

      - name: Create Version Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: version/v${{ inputs.version }}
          delete-branch: true
          title: Prepare RomDeck v${{ inputs.version }}
          commit-message: Prepare RomDeck v${{ inputs.version }}
          body: |
            Prepares version files for RomDeck v${{ inputs.version }}.

            Merge this PR after CI passes. Once the version commit lands on `main`, the release workflow will create tag `v${{ inputs.version }}`, build desktop packages, and attach installers to a draft GitHub Release.
          labels: release

      - name: Trigger CI For Version Pull Request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"
