name: Prepare Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to prepare, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare Version Patch
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set Version
        run: |
          node scripts/set-version.mjs "${{ inputs.version }}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate
        run: |
          npm run build
          npm test
          npm run typecheck

      - name: Create Version Patch
        run: |
          git diff --binary > "romdeck-v${{ inputs.version }}.patch"
          git status --short

      - name: Upload Version Patch
        uses: actions/upload-artifact@v4
        with:
          name: romdeck-v${{ inputs.version }}-version-patch
          path: romdeck-v${{ inputs.version }}.patch
          if-no-files-found: error
