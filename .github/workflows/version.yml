name: Prepare Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to prepare, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-version:
    name: Prepare Version Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set Version
        run: |
          node scripts/set-version.mjs "${{ inputs.version }}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate
        run: |
          npm run build
          npm test
          npm run typecheck

      - name: Create Version Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ inputs.version }}
          title: Prepare RomDeck v${{ inputs.version }}
          commit-message: Prepare RomDeck v${{ inputs.version }}
          body: |
            Prepares version files for RomDeck v${{ inputs.version }}.

            After this PR is merged, create and push tag `v${{ inputs.version }}` to trigger the release workflow.
          labels: release
