name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-tauri:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            artifact: macos-aarch64
            node-platform: darwin
            node-arch: arm64
          - label: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            artifact: macos-x64
            node-platform: darwin
            node-arch: x64
          - label: Linux x64
            platform: ubuntu-24.04
            args: ""
            rust-targets: ""
            artifact: linux-x64
            node-platform: linux
            node-arch: x64
          - label: Windows x64
            platform: windows-latest
            args: ""
            rust-targets: ""
            artifact: windows-x64
            node-platform: win
            node-arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri -> target

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri Bundle
        uses: tauri-apps/tauri-action@v1
        env:
          ROMDECK_NODE_PLATFORM: ${{ matrix.node-platform }}
          ROMDECK_NODE_ARCH: ${{ matrix.node-arch }}
        with:
          projectPath: packages/desktop-tauri
          args: ${{ matrix.args }}

      - name: Upload Bundle Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: romdeck-${{ matrix.artifact }}
          path: |
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.dmg
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.AppImage
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.deb
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.rpm
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.msi
            packages/desktop-tauri/src-tauri/target/**/release/bundle/**/*.exe
            packages/desktop-tauri/src-tauri/target/**/release/romdeck
            packages/desktop-tauri/src-tauri/target/**/release/romdeck.exe
          if-no-files-found: error
